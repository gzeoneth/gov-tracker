name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Check formatting
        run: yarn format:check

      - name: Build TypeScript
        run: yarn build

      - name: Run fast tests
        run: yarn test

  all-tests:
    name: All Tests with RPC
    runs-on: ubuntu-latest
    # Only run all tests if RPC secrets are available
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build TypeScript
        run: yarn build

      - name: Run all tests with coverage
        run: yarn test:cov --reporter=junit --outputFile=junit.xml
        env:
          ETH_RPC: ${{ secrets.ETH_RPC }}
          ARB1_RPC: ${{ secrets.ARB1_RPC }}
          NOVA_RPC: ${{ secrets.NOVA_RPC }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-regular
          path: coverage/coverage-final.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          flags: all-tests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: ./junit.xml
          report_type: test_results
          fail_ci_if_error: false
          flags: all-tests
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  fork-tests:
    name: Fork Tests
    runs-on: ubuntu-latest
    # Only run all tests if RPC secrets are available
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'yarn'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build TypeScript
        run: yarn build

      - name: Run fork tests with coverage
        run: yarn test:cov:fork --reporter=junit --outputFile=junit.xml
        env:
          ETH_RPC: ${{ secrets.ETH_RPC }}
          ARB1_RPC: ${{ secrets.ARB1_RPC }}
          ARB1_ARCHIVE_RPC: ${{ secrets.ARB1_ARCHIVE_RPC }}
          NOVA_RPC: ${{ secrets.NOVA_RPC }}
        timeout-minutes: 15

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fork
          path: coverage-fork/coverage-final.json

      - name: Upload fork test coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-fork/coverage-final.json
          flags: fork-tests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: ./junit.xml
          report_type: test_results
          fail_ci_if_error: false
          flags: fork-tests
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  merged-coverage:
    name: Merged Coverage Report
    runs-on: ubuntu-latest
    needs: [all-tests, fork-tests]
    if: always() && (needs.all-tests.result == 'success' && needs.fork-tests.result == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: false

      - name: Prepare coverage directories
        run: |
          mkdir -p coverage coverage-fork
          mv coverage-regular/coverage-final.json coverage/
          mv coverage-fork/coverage-final.json coverage-fork/

      - name: Merge coverage reports
        run: yarn test:cov:merge

      - name: Upload merged coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-merged/lcov.info
          flags: merged
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
