name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Check formatting
        run: yarn format:check

      - name: Build TypeScript
        run: yarn build

      - name: Run fast tests
        run: yarn test

  all-tests:
    name: All Tests with RPC
    runs-on: ubuntu-latest
    # Only run all tests if RPC secrets are available
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build TypeScript
        run: yarn build

      - name: Run all tests
        run: yarn test:coverage:all
        env:
          ETH_RPC: ${{ secrets.ETH_RPC }}
          ARB1_RPC: ${{ secrets.ARB1_RPC }}
          NOVA_RPC: ${{ secrets.NOVA_RPC }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true

  fork-tests:
    name: Fork Tests
    runs-on: ubuntu-latest
    # Only run all tests if RPC secrets are available
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'yarn'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build TypeScript
        run: yarn build

      - name: Run fork tests
        run: yarn test:fork
        env:
          ETH_RPC: ${{ secrets.ETH_RPC }}
          ARB1_RPC: ${{ secrets.ARB1_RPC }}
          ARB1_ARCHIVE_RPC: ${{ secrets.ARB1_ARCHIVE_RPC }}
          NOVA_RPC: ${{ secrets.NOVA_RPC }}
        timeout-minutes: 15
