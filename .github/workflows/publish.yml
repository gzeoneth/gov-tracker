name: Publish to npm

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "npm dist-tag"
        required: true
        default: "alpha"
        type: choice
        options: [alpha, beta]

permissions:
  id-token: write
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    # Skip on: release commits (avoid double run), prerelease tags (created by this workflow)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.ref_type == 'tag' && !contains(github.ref_name, '-')) ||
      (github.ref_type == 'branch' && github.event.head_commit && !startsWith(github.event.head_commit.message || '', 'release:'))
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm format:check
      - run: pnpm build
      - run: pnpm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Validate tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          [[ "$PKG_VERSION" == "$TAG_VERSION" ]] || { echo "::error::Version mismatch: package.json=$PKG_VERSION tag=$TAG_VERSION"; exit 1; }

      - name: Set prerelease version
        if: github.ref_type != 'tag'
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          SHA=${GITHUB_SHA::7}
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${BASE}-alpha.${SHA}"
          else
            VERSION="${BASE}-beta.${SHA}"
          fi
          npm version "$VERSION" --no-git-tag-version
          echo "Version: $VERSION"

      - name: Publish
        id: publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.npm_tag }}"
          elif [[ "$VERSION" == *-* ]]; then
            TAG="beta"
          else
            TAG="latest"
          fi
          npm publish --access public --tag "$TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create git tag for prerelease
        if: github.ref_type != 'tag'
        run: |
          git tag "v${{ steps.publish.outputs.version }}"
          git push origin "v${{ steps.publish.outputs.version }}" || echo "::warning::Failed to push tag, but npm publish succeeded"
