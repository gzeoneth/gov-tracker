name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run linter
        run: yarn lint
      - name: Check formatting
        run: yarn format:check
      - name: Build TypeScript
        run: yarn build
      - name: Run fast tests
        run: yarn test
      - name: Publish to npm
        run: npm publish --access public